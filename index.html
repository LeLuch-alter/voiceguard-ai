<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VoiceGuard AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#08050f;color:#fff;min-height:100vh;overflow:hidden}

/* ─── BLOBS ─── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 10s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:#7c3aed;top:-140px;left:-120px;animation-delay:0s}
.b2{width:420px;height:420px;background:#2563eb;bottom:-100px;right:-80px;animation-delay:-3s}
.b3{width:280px;height:280px;background:#a855f7;bottom:120px;left:35%;animation-delay:-5s}
.b4{width:180px;height:180px;background:#06b6d4;top:40%;right:18%;animation-delay:-2s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-18px) scale(1.07)}100%{transform:translate(-18px,28px) scale(.95)}}

/* ─── PAGES ─── */
.page{position:relative;z-index:1;display:none;width:100%;height:100vh}
.page.active{display:flex}

/* ─── AUTH ─── */
#auth-page{align-items:center;justify-content:center;padding:1rem}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.07);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:2.5rem 2rem;box-shadow:0 32px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);animation:slideUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.logo{width:52px;height:52px;background:linear-gradient(135deg,#7c3aed,#2563eb);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:22px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.5)}
.card h1{text-align:center;font-size:1.75rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.25rem}
.card .sub{text-align:center;font-size:.8rem;color:rgba(255,255,255,.35);margin-bottom:2rem}
.field{position:relative;margin-bottom:1rem}
.field input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.85rem 2.5rem .85rem 1rem;color:#fff;font-family:'Sora',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s,background .2s}
.field input::placeholder{color:rgba(255,255,255,.3)}
.field input:focus{border-color:rgba(124,58,237,.7);background:rgba(255,255,255,.1)}
.field .ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:15px;pointer-events:none}
.row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem;margin-top:.2rem}
.remember{display:flex;align-items:center;gap:6px;font-size:.77rem;color:rgba(255,255,255,.4);cursor:pointer}
.remember input{accent-color:#7c3aed;width:13px;height:13px}
.forgot{font-size:.77rem;color:rgba(255,255,255,.4);cursor:pointer;transition:color .2s}
.forgot:hover{color:#a78bfa}
.btn-main{width:100%;padding:.9rem;background:#fff;color:#0a0a1a;font-family:'Sora',sans-serif;font-size:.95rem;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;box-shadow:0 4px 20px rgba(255,255,255,.12)}
.btn-main:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 28px rgba(255,255,255,.18)}
.btn-main:active:not(:disabled){transform:scale(.98)}
.btn-main:disabled{opacity:.55;cursor:not-allowed}
.err-box{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:.6rem .9rem;color:#fca5a5;font-size:.78rem;margin-bottom:1rem;text-align:center;display:none}
.switch-line{text-align:center;margin-top:1.5rem;font-size:.8rem;color:rgba(255,255,255,.3)}
.switch-line span{color:#a78bfa;font-weight:600;cursor:pointer;margin-left:4px;transition:color .2s}
.switch-line span:hover{color:#c4b5fd}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(0,0,0,.2);border-top-color:#0a0a1a;border-radius:50%;animation:spin .7s linear infinite;margin-right:7px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#confirm-field{display:none}

/* ─── CHAT ─── */
#chat-page{flex-direction:row}

/* SIDEBAR */
.sidebar{width:255px;min-width:255px;background:rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;padding:1.1rem .9rem;gap:.45rem;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.brand{display:flex;align-items:center;gap:9px;padding:.4rem .4rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:.4rem}
.brand-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 4px 14px var(--glow)}
.brand-name{font-size:.82rem;font-weight:600;line-height:1.2}
.brand-sub{font-size:.65rem;color:rgba(255,255,255,.3)}
.sb-label{font-size:.65rem;font-weight:600;color:rgba(255,255,255,.28);letter-spacing:.08em;text-transform:uppercase;padding:.65rem .4rem .35rem}
.preset{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:.6rem .8rem;color:rgba(255,255,255,.6);font-family:'Sora',sans-serif;font-size:.75rem;line-height:1.4;text-align:left;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.preset:hover{background:rgba(255,255,255,.09);border-color:var(--primary);color:#fff}
.spacer{flex:1}
.settings-panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:.9rem;display:flex;flex-direction:column;gap:.65rem}
.s-label{font-size:.65rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.swatches{display:flex;gap:6px}
.swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.swatch:hover{transform:scale(1.18)}
.swatch.on{border-color:#fff}
.lang-row{display:flex;gap:5px}
.lbtn{padding:3px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.4);font-family:'Sora',sans-serif;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s}
.lbtn.on,.lbtn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.sb-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:.6rem .8rem;color:rgba(255,255,255,.45);font-family:'Sora',sans-serif;font-size:.75rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s;width:100%}
.sb-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:.4rem;border-top:1px solid rgba(255,255,255,.07);margin-top:.2rem}
.user-name{font-size:.75rem;color:rgba(255,255,255,.4)}
.logout-btn{background:transparent;border:none;color:rgba(255,255,255,.28);font-family:'Sora',sans-serif;font-size:.7rem;cursor:pointer;transition:color .15s}
.logout-btn:hover{color:#f87171}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:.9rem 1.4rem;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(34,197,94,.3)}50%{box-shadow:0 0 0 5px rgba(34,197,94,.08)}}
.header-title{font-size:.92rem;font-weight:600}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.header-sub{font-size:.68rem;color:rgba(255,255,255,.3)}
.clear-btn{background:transparent;border:none;color:rgba(255,255,255,.22);font-family:'Sora',sans-serif;font-size:.68rem;cursor:pointer;transition:color .15s}
.clear-btn:hover{color:rgba(255,255,255,.55)}
.messages{flex:1;overflow-y:auto;padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.msg-row{display:flex;gap:9px;align-items:flex-end;animation:fadeIn .22s ease}
.msg-row.user{flex-direction:row-reverse}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.avatar.bot{background:var(--primary);box-shadow:0 2px 10px var(--glow)}
.avatar.usr{background:rgba(255,255,255,.12)}
.bubble{max-width:68%;padding:.7rem .95rem;border-radius:15px;font-size:.85rem;line-height:1.6}
.bubble.bot{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:4px;color:rgba(255,255,255,.9)}
.bubble.user{background:var(--primary);border-bottom-right-radius:4px;color:#fff;box-shadow:0 4px 14px var(--glow)}
.typing{display:flex;gap:4px;align-items:center;padding:.2rem 0}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bounce 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.input-area{padding:.9rem 1.4rem 1.1rem;border-top:1px solid rgba(255,255,255,.06)}
.input-row{display:flex;gap:9px;align-items:flex-end;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:.6rem .6rem .6rem .95rem;transition:border-color .2s}
.input-row:focus-within{border-color:var(--primary-40)}
.input-row textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Sora',sans-serif;font-size:.85rem;line-height:1.5;resize:none;min-height:21px;max-height:110px}
.input-row textarea::placeholder{color:rgba(255,255,255,.22)}
.send-btn{width:34px;height:34px;flex-shrink:0;background:var(--primary);border:none;border-radius:9px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .15s,box-shadow .2s;box-shadow:0 2px 10px var(--glow)}
.send-btn:hover:not(:disabled){transform:scale(1.07);box-shadow:0 4px 16px var(--glow)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}

/* API KEY NOTICE */
.api-notice{background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.25);border-radius:10px;padding:.55rem .9rem;font-size:.72rem;color:rgba(234,179,8,.8);margin-bottom:.8rem;text-align:center}
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<!-- ═══ AUTH PAGE ═══ -->
<div class="page active" id="auth-page">
  <div class="card">
    <div class="logo"><img src="/logo.png" style="width:36px;height:36px;object-fit:contain;"/></div>
    <h1 id="auth-title">Login</h1>
    <p class="sub">VoiceGuard AI · Smart Business Assistant</p>

    <div class="api-notice">
      🔑 First time? Register first.
    </div>

    <div class="err-box" id="err-box">Error message</div>

    <div class="field">
      <input id="inp-user" type="text" placeholder="Username" autocomplete="username"/>
      <span class="ico">👤</span>
    </div>
    <div class="field">
      <input id="inp-pass" type="password" placeholder="Password" autocomplete="current-password"/>
      <span class="ico">🔒</span>
    </div>
    <div class="field" id="confirm-field">
      <input id="inp-confirm" type="password" placeholder="Confirm Password" autocomplete="new-password"/>
      <span class="ico">🔒</span>
    </div>

    <div class="row-between" id="remember-row">
      <label class="remember"><input type="checkbox" id="remember-me"/> Remember Me</label>
      <span class="forgot">Forgot password?</span>
    </div>

    <button class="btn-main" id="auth-btn" onclick="submitAuth()">Login</button>

    <p class="switch-line" id="switch-line">
      Don't have an account? <span onclick="toggleMode()">Register</span>
    </p>
  </div>
</div>

<!-- ═══ CHAT PAGE ═══ -->
<div class="page" id="chat-page">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-ico" style="background:transparent"><img src="/logo.png" style="width:28px;height:28px;object-fit:contain;"/></div>
      <div>
        <div class="brand-name">VoiceGuard AI</div>
        <div class="brand-sub">Business Assistant</div>
      </div>
    </div>

    <div class="sb-label">Quick Questions</div>
    <div id="presets"></div>

    <div class="spacer"></div>

    <div id="settings-panel" class="settings-panel" style="display:none">
      <div>
        <div class="s-label">Theme</div>
        <div class="swatches" id="swatches"></div>
      </div>
      <div>
        <div class="s-label">Language</div>
        <div class="lang-row">
          <button class="lbtn on" onclick="setLang('en')">EN</button>
          <button class="lbtn" onclick="setLang('ru')">RU</button>
          <button class="lbtn" onclick="setLang('kz')">KZ</button>
        </div>
      </div>
    </div>

    <button class="sb-btn" onclick="toggleSettings()">⚙️ <span id="sb-settings">Settings</span></button>
    <button class="sb-btn" onclick="clearChat()">🗑️ <span id="sb-clear">Clear chat</span></button>

    <div class="user-row">
      <span class="user-name" id="user-display">👤 user</span>
      <button class="logout-btn" onclick="logout()" id="sb-logout">Logout</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="chat-header">
      <div class="dot"></div>
      <span class="header-title">VoiceGuard AI</span>
      <div class="header-right">
        <span class="header-sub">Online · Ready to help</span>
        <button class="clear-btn" onclick="clearChat()" id="hdr-clear">Clear</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="msg-input" rows="1" placeholder="Ask me anything..."></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── THEMES ───
const THEMES = {
  purple:{ primary:'#7c3aed', accent:'#a78bfa', glow:'rgba(124,58,237,.32)', bg:'#08050f' },
  blue:  { primary:'#2563eb', accent:'#60a5fa', glow:'rgba(37,99,235,.32)',  bg:'#05080f' },
  teal:  { primary:'#0d9488', accent:'#2dd4bf', glow:'rgba(13,148,136,.32)', bg:'#050f0e' },
  pink:  { primary:'#db2777', accent:'#f472b6', glow:'rgba(219,39,119,.32)', bg:'#0f0508' },
};

// ─── LANGUAGES ───
const L = {
  en:{ placeholder:'Ask me anything...', welcome:"Hello! I'm VoiceGuard AI — your intelligent business assistant. How can I help you today?",
       presets:['What can you do?','Tell me about your services','How does fraud protection work?','I want a free trial lesson'],
       settings:'Settings', clear:'Clear chat', logout:'Logout', thinking:'Thinking...',
       systemEn:'Always respond in English.' },
  ru:{ placeholder:'Задайте вопрос...', welcome:'Здравствуйте! Я VoiceGuard AI — ваш бизнес-ассистент. Чем могу помочь?',
       presets:['Что ты умеешь?','Расскажи об услугах','Как работает защита от мошенников?','Хочу пробный урок'],
       settings:'Настройки', clear:'Очистить', logout:'Выйти', thinking:'Думаю...',
       systemEn:'Always respond in Russian.' },
  kz:{ placeholder:'Сұрақ қойыңыз...', welcome:'Сәлем! Мен VoiceGuard AI. Қалай көмектесе аламын?',
       presets:['Сен не істей аласың?','Қызметтер туралы айт','Алаяқтардан қорғану қалай?','Сынақ сабақ алғым келеді'],
       settings:'Баптаулар', clear:'Тазалау', logout:'Шығу', thinking:'Ойланып жатырмын...',
       systemEn:'Always respond in Kazakh.' },
};

// ─── STATE ───
let mode = 'login';
let lang = 'en';
let theme = 'purple';
let messages = [];
let loading = false;
let currentUser = '';
let groqKey = '';


// ─── INIT ───
function init(){
  const u = localStorage.getItem('vg_user');
  if(u){ currentUser = u; showChat(); }
  if(groqKey) document.getElementById('api-key-inp').value = groqKey;
  applyTheme('purple');
  buildSwatches();
  buildPresets();
  updateLabels();
  const ta = document.getElementById('msg-input');
  ta.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 110) + 'px';
  });
}


// ─── THEME ───
function applyTheme(t){
  theme = t;
  const c = THEMES[t];
  document.body.style.background = c.bg;
  const r = document.documentElement.style;
  r.setProperty('--primary', c.primary);
  r.setProperty('--accent',  c.accent);
  r.setProperty('--glow',    c.glow);
  r.setProperty('--primary-40', c.primary + '60');
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s.dataset.t === t));
  document.querySelectorAll('.brand-ico, .avatar.bot, .bubble.user, .send-btn').forEach(el => {
    el.style.background = c.primary;
    if(el.classList.contains('bubble') || el.classList.contains('send-btn') || el.classList.contains('avatar'))
      el.style.boxShadow = `0 4px 14px ${c.glow}`;
  });
  document.querySelectorAll('.typing span').forEach(s => s.style.background = c.accent);
  localStorage.setItem('vg_theme', t);
}

function buildSwatches(){
  const wrap = document.getElementById('swatches');
  wrap.innerHTML = '';
  Object.entries(THEMES).forEach(([key, val]) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (key === theme ? ' on' : '');
    d.style.background = val.primary;
    d.dataset.t = key;
    d.title = key;
    d.onclick = () => applyTheme(key);
    wrap.appendChild(d);
  });
}

// ─── LANGUAGE ───
function setLang(l){
  lang = l;
  document.querySelectorAll('.lbtn').forEach(b => b.classList.remove('on'));
  event.target.classList.add('on');
  buildPresets();
  updateLabels();
  if(messages.length > 0 && messages[0].role === 'assistant'){
    messages[0].text = L[l].welcome;
    renderMessages();
  }
}

// ─── LABELS ───
function updateLabels(){
  const t = L[lang];
  document.getElementById('msg-input').placeholder = t.placeholder;
  document.getElementById('sb-settings').textContent = t.settings;
  document.getElementById('sb-clear').textContent = t.clear;
  document.getElementById('sb-logout').textContent = t.logout;
  document.getElementById('hdr-clear').textContent = t.clear;
}

function buildPresets(){
  const wrap = document.getElementById('presets');
  wrap.innerHTML = '';
  L[lang].presets.forEach(q => {
    const b = document.createElement('button');
    b.className = 'preset';
    b.textContent = q;
    b.onclick = () => sendMessage(q);
    wrap.appendChild(b);
  });
}

// ─── AUTH ───
function toggleMode(){
  mode = mode === 'login' ? 'register' : 'login';
  const isReg = mode === 'register';
  document.getElementById('auth-title').textContent = isReg ? 'Register' : 'Login';
  document.getElementById('confirm-field').style.display = isReg ? 'block' : 'none';
  document.getElementById('remember-row').style.display = isReg ? 'none' : 'flex';
  document.getElementById('auth-btn').textContent = isReg ? 'Create Account' : 'Login';
  document.getElementById('switch-line').innerHTML = isReg
    ? "Already have an account? <span onclick='toggleMode()'>Login</span>"
    : "Don't have an account? <span onclick='toggleMode()'>Register</span>";
  showErr('');
}

function showErr(msg){
  const b = document.getElementById('err-box');
  b.textContent = msg;
  b.style.display = msg ? 'block' : 'none';
}

async function submitAuth(){
  const user = document.getElementById('inp-user').value.trim();
  const pass = document.getElementById('inp-pass').value;
  if(!user || !pass){ showErr('Please fill all fields'); return; }
  const btn = document.getElementById('auth-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Please wait...';
  await new Promise(r => setTimeout(r, 600));
  const users = JSON.parse(localStorage.getItem('vg_users') || '{}');
  if(mode === 'register'){
    const confirm = document.getElementById('inp-confirm').value;
    if(pass !== confirm){ showErr('Passwords do not match'); btn.disabled=false; btn.textContent='Create Account'; return; }
    if(pass.length < 6){ showErr('Password must be at least 6 characters'); btn.disabled=false; btn.textContent='Create Account'; return; }
    if(users[user]){ showErr('Username already exists'); btn.disabled=false; btn.textContent='Create Account'; return; }
    users[user] = pass;
    localStorage.setItem('vg_users', JSON.stringify(users));
  } else {
    if(!users[user] || users[user] !== pass){ showErr('Invalid username or password'); btn.disabled=false; btn.textContent='Login'; return; }
  }
  localStorage.setItem('vg_user', user);
  currentUser = user;
  showChat();
}

function showChat(){
  document.getElementById('auth-page').classList.remove('active');
  document.getElementById('chat-page').classList.add('active');
  document.getElementById('user-display').textContent = '👤 ' + currentUser;
  messages = [{ role:'assistant', text: L[lang].welcome, id: Date.now() }];
  renderMessages();
}

function logout(){
  localStorage.removeItem('vg_user');
  currentUser = '';
  messages = [];
  document.getElementById('chat-page').classList.remove('active');
  document.getElementById('auth-page').classList.add('active');
  document.getElementById('inp-user').value = '';
  document.getElementById('inp-pass').value = '';
  const btn = document.getElementById('auth-btn');
  btn.disabled = false; btn.textContent = 'Login';
  if(mode !== 'login') toggleMode();
}

// ─── SETTINGS ───
function toggleSettings(){
  const p = document.getElementById('settings-panel');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  p.style.flexDirection = 'column';
}

function saveKey(){
  groqKey = document.getElementById('api-key-inp').value.trim();
  localStorage.setItem('vg_key', groqKey);
  alert('API key saved!');
}

// ─── CHAT ───
function clearChat(){
  messages = [{ role:'assistant', text: L[lang].welcome, id: Date.now() }];
  renderMessages();
}

function renderMessages(){
  const wrap = document.getElementById('messages');
  wrap.innerHTML = '';
  messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg-row' + (m.role === 'user' ? ' user' : '');
    const av = document.createElement('div');
    av.className = 'avatar ' + (m.role === 'user' ? 'usr' : 'bot');
    av.style.background = m.role === 'user' ? 'rgba(255,255,255,.12)' : THEMES[theme].primary;
    if(m.role === 'user'){
      av.textContent = currentUser[0]?.toUpperCase();
    } else {
      av.innerHTML = '<img src="/logo.png" style="width:20px;height:20px;object-fit:contain;"/>';
    }
    const bub = document.createElement('div');
    bub.className = 'bubble ' + (m.role === 'user' ? 'user' : 'bot');
    if(m.role === 'user'){ bub.style.background = THEMES[theme].primary; bub.style.boxShadow = `0 4px 14px ${THEMES[theme].glow}`; }
    bub.textContent = m.text;
    row.appendChild(av); row.appendChild(bub);
    wrap.appendChild(row);
  });
  wrap.scrollTop = wrap.scrollHeight;
}

function showTyping(){
  const wrap = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = 'typing-row';
  const av = document.createElement('div');
  av.className = 'avatar bot'; av.style.background = THEMES[theme].primary; av.textContent = 'V';
  const bub = document.createElement('div');
  bub.className = 'bubble bot';
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  bub.querySelectorAll('span').forEach(s => s.style.background = THEMES[theme].accent);
  row.appendChild(av); row.appendChild(bub);
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

function removeTyping(){
  const el = document.getElementById('typing-row');
  if(el) el.remove();
}

async function sendMessage(preset){
  const ta = document.getElementById('msg-input');
  const text = preset || ta.value.trim();
  if(!text || loading) return;
  ta.value = ''; ta.style.height = 'auto';

  messages.push({ role:'user', text, id: Date.now() });
  renderMessages();
  loading = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();


  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: messages.slice(-10), lang })
    });
    const data = await res.json();
    const reply = data.reply || "Sorry, I couldn't respond. Please try again.";
    removeTyping();
    messages.push({ role:'assistant', text: reply, id: Date.now()+1 });

  } catch(e) {
    removeTyping();
    messages.push({ role:'assistant', text:'Connection error. Check your API key and try again.', id: Date.now()+1 });
  }
  renderMessages();
  loading = false;
  document.getElementById('send-btn').disabled = false;
  ta.focus();
}

init();
</script>
</body>
</html>
