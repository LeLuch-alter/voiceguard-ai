<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VoiceGuard AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--font:'Sora',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--font);overflow-x:hidden}
#view-chat{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
/* CHAT */
#view-chat{font-family:'Sora',sans-serif}
.chat-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 10s ease-in-out infinite alternate}
.b1{width:520px;height:520px;top:-140px;left:-120px;animation-delay:0s}
.b2{width:420px;height:420px;bottom:-100px;right:-80px;animation-delay:-3s}
.b3{width:280px;height:280px;bottom:120px;left:35%;animation-delay:-5s}
.b4{width:180px;height:180px;top:40%;right:18%;animation-delay:-2s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-18px) scale(1.07)}100%{transform:translate(-18px,28px) scale(.95)}}
.cpage{position:relative;z-index:1;display:none;width:100%;height:100vh;height:100dvh}
.cpage.active{display:flex}
#chat-page{flex-direction:row}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;backdrop-filter:blur(2px)}
.sidebar-overlay.show{display:block}
.sidebar{width:255px;min-width:255px;background:rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;padding:1.1rem .9rem;gap:.45rem;overflow-y:auto;z-index:11;transition:transform .3s cubic-bezier(.16,1,.3,1);max-height:100vh;max-height:100dvh}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.brand{display:flex;align-items:center;gap:9px;padding:.4rem .4rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:.4rem}
.brand-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:.82rem;font-weight:600;line-height:1.2}
.brand-sub{font-size:.65rem;color:rgba(255,255,255,.3)}
.sidebar-close{display:none;background:transparent;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;margin-left:auto;padding:2px 6px;line-height:1}
.sb-label{font-size:.65rem;font-weight:600;color:rgba(255,255,255,.28);letter-spacing:.08em;text-transform:uppercase;padding:.65rem .4rem .35rem}
.preset{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:.6rem .8rem;color:rgba(255,255,255,.6);font-family:'Sora',sans-serif;font-size:.75rem;line-height:1.4;text-align:left;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.preset:hover{background:rgba(255,255,255,.09);border-color:var(--primary);color:#fff}
.spacer{flex:1}
.settings-panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:.9rem;display:flex;flex-direction:column;gap:.65rem}
.s-label{font-size:.65rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.swatches{display:flex;gap:6px}
.swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.swatch:hover{transform:scale(1.18)}
.swatch.on{border-color:#fff}
.lang-row{display:flex;gap:5px}
.lbtn{padding:3px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.4);font-family:'Sora',sans-serif;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s}
.lbtn.on,.lbtn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.sb-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:.6rem .8rem;color:rgba(255,255,255,.45);font-family:'Sora',sans-serif;font-size:.75rem;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s;width:100%}
.sb-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:.9rem 1.4rem;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:9px}
.c-hamburger{display:none;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;padding:2px 4px;flex-shrink:0;line-height:1}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(34,197,94,.3)}50%{box-shadow:0 0 0 5px rgba(34,197,94,.08)}}
.header-title{font-size:.92rem;font-weight:600}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.header-sub{font-size:.68rem;color:rgba(255,255,255,.3)}
.clear-btn{background:transparent;border:none;color:rgba(255,255,255,.22);font-family:'Sora',sans-serif;font-size:.68rem;cursor:pointer;transition:color .15s}
.clear-btn:hover{color:rgba(255,255,255,.55)}
.messages{flex:1;overflow-y:auto;padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.msg-row{display:flex;gap:9px;align-items:flex-end;animation:fadeIn .22s ease}
.msg-row.user{flex-direction:row-reverse}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden}
.avatar.bot{background:transparent}
.bubble{max-width:68%;padding:.7rem .95rem;border-radius:15px;font-size:.85rem;line-height:1.6}
.bubble.bot{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:4px;color:rgba(255,255,255,.9)}
.bubble.user{background:var(--primary);border-bottom-right-radius:4px;color:#fff;box-shadow:0 4px 14px var(--glow)}
.typing{display:flex;gap:4px;align-items:center;padding:.2rem 0}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bounce 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.input-area{padding:.9rem 1.4rem 1.1rem;border-top:1px solid rgba(255,255,255,.06)}
.input-row{display:flex;gap:9px;align-items:flex-end;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:.6rem .6rem .6rem .95rem;transition:border-color .2s}
.input-row:focus-within{border-color:var(--primary-40)}
.input-row textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Sora',sans-serif;font-size:.85rem;line-height:1.5;resize:none;min-height:21px;max-height:110px}
.input-row textarea::placeholder{color:rgba(255,255,255,.22)}
.send-btn{width:34px;height:34px;flex-shrink:0;background:var(--primary);border:none;border-radius:9px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .15s,box-shadow .2s;box-shadow:0 2px 10px var(--glow)}
.send-btn:hover:not(:disabled){transform:scale(1.07)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.mic-btn{width:34px;height:34px;flex-shrink:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:9px;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .15s,background .2s}
.mic-btn:hover:not(:disabled){transform:scale(1.07)}
.mic-btn:disabled{opacity:.35;cursor:not-allowed}
.mic-btn.rec{background:#ef4444;border-color:#ef4444;color:#fff;animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 7px rgba(239,68,68,0)}}
.voice-toggle{background:transparent;border:none;cursor:pointer;font-size:15px;line-height:1;opacity:.4;padding:2px;transition:opacity .2s}
.voice-toggle.on{opacity:1}
@media(max-width:640px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);box-shadow:4px 0 32px rgba(0,0,0,.6);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .sidebar.open{transform:translateX(0)}
  .sidebar-close{display:block}
  .c-hamburger{display:flex}
  .bubble{max-width:84%}
  .messages{padding:1rem}
  .input-area{padding:.7rem .9rem .9rem}
  .chat-header{padding:.75rem 1rem}
  .header-sub{display:none}
}
@supports not (height:100dvh){.cpage,.main{height:calc(var(--vh,1vh)*100)}}
</style>
</head>
<body>

<!-- CHAT VIEW -->
<div id="view-chat">
  <div class="chat-bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
  <div class="cpage active" id="chat-page">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSB()"></div>
    <div class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-ico"><img src="logo.png" style="width:120px;height:120px;object-fit:contain;border-radius:10px;"/></div>
        <div><div class="brand-name">VoiceGuard AI</div><div class="brand-sub">Your AI Operator</div></div>
        <button class="sidebar-close" onclick="closeSB()">✕</button>
      </div>
      <div class="sb-label">Быстрые вопросы</div>
      <div id="presets"></div>
      <div class="spacer"></div>
      <div id="settings-panel" class="settings-panel" style="display:none">
        <div><div class="s-label">Тема</div><div class="swatches" id="swatches"></div></div>
        <div><div class="s-label">Язык</div><div class="lang-row"><button class="lbtn on" onclick="setLang('ru',this)">RU</button><button class="lbtn" onclick="setLang('en',this)">EN</button><button class="lbtn" onclick="setLang('kz',this)">KZ</button></div></div>
      </div>
      <button class="sb-btn" onclick="toggleSettings()">⚙️ <span id="sb-settings">Настройки</span></button>
      <button class="sb-btn" onclick="clearChat()">🗑️ <span id="sb-clear">Очистить чат</span></button>
    </div>
    <div class="main">
      <div class="chat-header">
        <button class="c-hamburger" onclick="openSB()">☰</button>
        <div class="dot"></div>
        <span class="header-title">VoiceGuard AI</span>
        <div class="header-right">
          <span class="header-sub" id="header-sub">Онлайн · Готов помочь</span>
          <button class="voice-toggle" id="voice-toggle" onclick="toggleVoice()" title="Озвучивать ответы">🔈</button>
          <button class="clear-btn" onclick="clearChat()" id="hdr-clear">Очистить</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area"><div class="input-row"><textarea id="msg-input" rows="1" placeholder="Задайте вопрос..."></textarea><button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Голосовой ввод">🎤</button><button class="send-btn" id="send-btn" onclick="sendMsg()" title="Отправить">➤</button></div></div>
    </div>
  </div>
</div>

<script>
const STORE_KEY='vg_messages';
const THEMES={
  grey:{primary:'#6b7280',accent:'#9ca3af',glow:'rgba(107,114,128,.28)',bodyBg:'#1f2124',sidebarBg:'rgba(15,16,18,.95)',sidebarBorder:'rgba(255,255,255,.07)',mainBg:'#1f2124',headerBg:'rgba(15,16,18,.7)',headerBorder:'rgba(255,255,255,.07)',inputAreaBg:'rgba(15,16,18,.5)',inputRowBg:'rgba(255,255,255,.05)',inputRowBorder:'rgba(255,255,255,.08)',bubbleBotBg:'rgba(255,255,255,.07)',bubbleBotBorder:'rgba(255,255,255,.09)',bubbleBotColor:'rgba(255,255,255,.9)',textColor:'#fff',textMuted:'rgba(255,255,255,.35)',cardBg:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.13)',settingsBg:'rgba(255,255,255,.05)',settingsBorder:'rgba(255,255,255,.09)',presetBg:'rgba(255,255,255,.05)',presetBorder:'rgba(255,255,255,.07)',presetColor:'rgba(255,255,255,.6)',sbBtnBg:'rgba(255,255,255,.05)',sbBtnBorder:'rgba(255,255,255,.07)',blobs:['#4b5563','#374151','#6b7280','#9ca3af'],inputTextColor:'#fff',ph:'rgba(255,255,255,.22)',mobileSB:'rgba(10,11,13,.97)',dark:true},
  blue:{primary:'#2563eb',accent:'#60a5fa',glow:'rgba(37,99,235,.32)',bodyBg:'#05080f',sidebarBg:'rgba(3,5,15,.95)',sidebarBorder:'rgba(255,255,255,.07)',mainBg:'#05080f',headerBg:'rgba(3,5,15,.7)',headerBorder:'rgba(255,255,255,.07)',inputAreaBg:'rgba(3,5,15,.5)',inputRowBg:'rgba(255,255,255,.06)',inputRowBorder:'rgba(255,255,255,.09)',bubbleBotBg:'rgba(255,255,255,.07)',bubbleBotBorder:'rgba(255,255,255,.08)',bubbleBotColor:'rgba(255,255,255,.9)',textColor:'#fff',textMuted:'rgba(255,255,255,.35)',cardBg:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.13)',settingsBg:'rgba(255,255,255,.05)',settingsBorder:'rgba(255,255,255,.09)',presetBg:'rgba(255,255,255,.05)',presetBorder:'rgba(255,255,255,.07)',presetColor:'rgba(255,255,255,.6)',sbBtnBg:'rgba(255,255,255,.05)',sbBtnBorder:'rgba(255,255,255,.07)',blobs:['#1d4ed8','#1e40af','#3b82f6','#06b6d4'],inputTextColor:'#fff',ph:'rgba(255,255,255,.22)',mobileSB:'rgba(2,4,12,.97)',dark:true},
  white:{primary:'#2563eb',accent:'#3b82f6',glow:'rgba(37,99,235,.22)',bodyBg:'#f0f2f5',sidebarBg:'rgba(255,255,255,.97)',sidebarBorder:'rgba(0,0,0,.08)',mainBg:'#f0f2f5',headerBg:'rgba(255,255,255,.92)',headerBorder:'rgba(0,0,0,.07)',inputAreaBg:'rgba(255,255,255,.8)',inputRowBg:'rgba(0,0,0,.04)',inputRowBorder:'rgba(0,0,0,.1)',bubbleBotBg:'#fff',bubbleBotBorder:'rgba(0,0,0,.08)',bubbleBotColor:'#1a1a2e',textColor:'#1a1a2e',textMuted:'rgba(0,0,0,.45)',cardBg:'rgba(255,255,255,.92)',cardBorder:'rgba(0,0,0,.1)',settingsBg:'rgba(0,0,0,.03)',settingsBorder:'rgba(0,0,0,.08)',presetBg:'rgba(0,0,0,.03)',presetBorder:'rgba(0,0,0,.08)',presetColor:'rgba(0,0,0,.55)',sbBtnBg:'rgba(0,0,0,.03)',sbBtnBorder:'rgba(0,0,0,.07)',blobs:['#bfdbfe','#ddd6fe','#e0f2fe','#fce7f3'],inputTextColor:'#1a1a2e',ph:'rgba(0,0,0,.3)',mobileSB:'rgba(240,242,245,.99)',dark:false},
};
const LANGS={
  ru:{ph:'Задайте вопрос...',welcome:'Здравствуйте! Я VoiceGuard AI — ваш виртуальный оператор. Помогу ответить на вопросы об услугах и ценах, оставить заявку. Чем могу помочь?',presets:['Расскажите о ваших услугах','Какие у вас цены?','Хочу оставить заявку','Как с вами связаться?'],settings:'Настройки',clear:'Очистить'},
  en:{ph:'Ask me anything...',welcome:"Hello! I'm VoiceGuard AI, your virtual operator. I can answer questions about services and prices, and take your request. How can I help?",presets:['Tell me about your services','What are your prices?','I want to leave a request','How can I contact you?'],settings:'Settings',clear:'Clear chat'},
  kz:{ph:'Сұрақ қойыңыз...',welcome:'Сәлем! Мен VoiceGuard AI — виртуалды операторыңыз. Қызметтер мен бағалар туралы сұрақтарға жауап беремін, өтінім қалдыруға көмектесемін. Қалай көмектесе аламын?',presets:['Қызметтеріңіз туралы айтыңыз','Бағаларыңыз қандай?','Өтінім қалдырғым келеді','Сізбен қалай байланысуға болады?'],settings:'Баптаулар',clear:'Тазалау'},
};

const STATES={
  ru:{ready:'Онлайн · Готов помочь',listen:'Слушаю...',proc:'Распознаю...',speak:'Говорю...',nomic:'Нет доступа к микрофону',empty:'Не расслышал, попробуйте ещё раз'},
  en:{ready:'Online · Ready to help',listen:'Listening...',proc:'Transcribing...',speak:'Speaking...',nomic:'No microphone access',empty:"Didn't catch that, try again"},
  kz:{ready:'Онлайн · Көмекке дайын',listen:'Тыңдап тұрмын...',proc:'Танып жатырмын...',speak:'Айтып жатырмын...',nomic:'Микрофонға рұқсат жоқ',empty:'Естімедім, қайталаңыз'},
};
const SR_LANG={ru:'ru-RU',en:'en-US',kz:'kk-KZ'};

let cLang='ru',theme='grey',msgs=[],loading=false;
let voiceOn=localStorage.getItem('vg_voice')==='1';
let mediaRecorder=null,audioChunks=[],recording=false;
const currentUser='Вы';

/* LOCAL STORAGE */
function saveMsgs(){try{localStorage.setItem(STORE_KEY,JSON.stringify(msgs));}catch(e){}}
function loadMsgs(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr)&&arr.length){msgs=arr;return;}}
  }catch(e){}
  msgs=[{role:'assistant',text:LANGS[cLang].welcome,id:Date.now()}];
}
function clearChat(){
  msgs=[{role:'assistant',text:LANGS[cLang].welcome,id:Date.now()}];
  saveMsgs();renderMsgs();closeSB();
}

/* CHAT UI */
function openSB(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-overlay').classList.add('show');}
function closeSB(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('show');}
function toggleSettings(){const p=document.getElementById('settings-panel');p.style.display=p.style.display==='none'?'flex':'none';p.style.flexDirection='column';}
function setLang(l,btn){cLang=l;document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');buildPresets();updateLabels();if(msgs.length>0&&msgs[0].role==='assistant'){msgs[0].text=LANGS[l].welcome;saveMsgs();renderMsgs();}if(!recording&&!loading)setState('ready');}
function updateLabels(){const L=LANGS[cLang];const ta=document.getElementById('msg-input');if(ta)ta.placeholder=L.ph;const ss=document.getElementById('sb-settings');if(ss)ss.textContent=L.settings;const sc=document.getElementById('sb-clear');if(sc)sc.textContent=L.clear;const hc=document.getElementById('hdr-clear');if(hc)hc.textContent=L.clear;}
function buildPresets(){const w=document.getElementById('presets');if(!w)return;w.innerHTML='';LANGS[cLang].presets.forEach(q=>{const b=document.createElement('button');b.className='preset';b.textContent=q;b.onclick=()=>{sendMsg(q);closeSB();};w.appendChild(b);});}

function renderMsgs(){
  const w=document.getElementById('messages');w.innerHTML='';
  msgs.forEach(m=>{
    const row=document.createElement('div');row.className='msg-row'+(m.role==='user'?' user':'');
    const av=document.createElement('div');av.className='avatar '+(m.role==='user'?'usr':'bot');
    if(m.role==='user'){av.style.background=THEMES[theme].primary;av.textContent=currentUser[0]?.toUpperCase();}
    else{av.style.background='transparent';av.innerHTML='<img src="logo.png" style="width:70px;height:70px;object-fit:contain;border-radius:50%;"/>';}
    const bub=document.createElement('div');bub.className='bubble '+(m.role==='user'?'user':'bot');
    if(m.role==='user'){bub.style.background=THEMES[theme].primary;bub.style.boxShadow=`0 4px 14px ${THEMES[theme].glow}`;}
    bub.textContent=m.text;
    row.appendChild(av);row.appendChild(bub);w.appendChild(row);
  });
  w.scrollTop=w.scrollHeight;applyTheme(theme);
}
function showTyping(){
  const w=document.getElementById('messages');const c=THEMES[theme];
  const row=document.createElement('div');row.className='msg-row';row.id='typing-row';
  const av=document.createElement('div');av.className='avatar bot';av.style.background='transparent';
  av.innerHTML='<img src="logo.png" style="width:70px;height:70px;object-fit:contain;border-radius:50%;"/>';
  const bub=document.createElement('div');bub.className='bubble bot';bub.style.background=c.bubbleBotBg;bub.style.borderColor=c.bubbleBotBorder;
  bub.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  bub.querySelectorAll('span').forEach(s=>s.style.background=c.accent);
  row.appendChild(av);row.appendChild(bub);w.appendChild(row);w.scrollTop=w.scrollHeight;
}
function removeTyping(){const e=document.getElementById('typing-row');if(e)e.remove();}

async function sendMsg(preset,viaVoice){
  const ta=document.getElementById('msg-input');const text=preset||ta.value.trim();
  if(!text||loading)return;ta.value='';ta.style.height='auto';
  stopSpeaking();
  msgs.push({role:'user',text,id:Date.now()});renderMsgs();saveMsgs();loading=true;
  document.getElementById('send-btn').disabled=true;showTyping();
  let reply='';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:msgs.slice(-10),lang:cLang})});
    const data=await res.json();
    reply=data.reply||'Извините, попробуйте снова.';
    removeTyping();msgs.push({role:'assistant',text:reply,id:Date.now()+1});saveMsgs();
  }catch(e){removeTyping();reply='';msgs.push({role:'assistant',text:'Ошибка соединения. Попробуйте снова.',id:Date.now()+1});saveMsgs();}
  renderMsgs();loading=false;document.getElementById('send-btn').disabled=false;ta.focus();
  if(reply&&(voiceOn||viaVoice))speak(reply);
}

/* VOICE: запись -> STT -> чат */
function setState(key){const el=document.getElementById('header-sub');if(el)el.textContent=(STATES[cLang]||STATES.en)[key]||'';}
function setMicRec(on){const b=document.getElementById('mic-btn');if(b)b.classList.toggle('rec',on);}

async function toggleMic(){
  if(recording){stopRec();return;}
  if(loading)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){alert((STATES[cLang]||STATES.en).nomic);return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stopSpeaking();
    mediaRecorder=new MediaRecorder(stream);audioChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
      await transcribeAndSend(blob);
    };
    mediaRecorder.start();recording=true;setMicRec(true);setState('listen');
  }catch(e){setState('ready');alert((STATES[cLang]||STATES.en).nomic);}
}
function stopRec(){if(mediaRecorder&&recording){recording=false;setMicRec(false);try{mediaRecorder.stop();}catch(e){}}}

function blobToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onloadend=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(blob);});}

async function transcribeAndSend(blob){
  setState('proc');document.getElementById('mic-btn').disabled=true;
  try{
    const b64=await blobToBase64(blob);
    const res=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,mime:blob.type||'audio/webm',lang:cLang})});
    const data=await res.json();
    const text=(data.text||'').trim();
    document.getElementById('mic-btn').disabled=false;setState('ready');
    if(text)sendMsg(text,true);
    else{setState('empty');setTimeout(()=>{if(!recording&&!loading)setState('ready');},2200);}
  }catch(e){document.getElementById('mic-btn').disabled=false;setState('ready');}
}

/* VOICE: озвучка ответов (TTS) */
function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SR_LANG[cLang]||'en-US';
  u.onstart=()=>setState('speak');
  u.onend=()=>{if(!recording&&!loading)setState('ready');};
  window.speechSynthesis.speak(u);
}
function stopSpeaking(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}
function toggleVoice(){
  voiceOn=!voiceOn;localStorage.setItem('vg_voice',voiceOn?'1':'0');
  updateVoiceBtn();if(!voiceOn)stopSpeaking();
}
function updateVoiceBtn(){const b=document.getElementById('voice-toggle');if(!b)return;b.classList.toggle('on',voiceOn);b.textContent=voiceOn?'🔊':'🔈';}

/* THEME */
function applyTheme(t){
  theme=t;const c=THEMES[t];
  const r=document.documentElement.style;r.setProperty('--primary',c.primary);r.setProperty('--accent',c.accent);r.setProperty('--glow',c.glow);r.setProperty('--primary-40',c.primary+'60');
  const vc=document.getElementById('view-chat');if(vc){vc.style.background=c.bodyBg;vc.style.color=c.textColor;}
  const cp=document.getElementById('chat-page');if(cp)cp.style.background=c.bodyBg;
  const mn=document.querySelector('.main');if(mn)mn.style.background=c.mainBg;
  const sb2=document.getElementById('sidebar');if(sb2){sb2.style.background=window.matchMedia('(max-width:640px)').matches?c.mobileSB:c.sidebarBg;sb2.style.borderRightColor=c.sidebarBorder;}
  const ch=document.querySelector('.chat-header');if(ch){ch.style.background=c.headerBg;ch.style.borderBottomColor=c.headerBorder;}
  const ia=document.querySelector('.input-area');if(ia){ia.style.background=c.inputAreaBg;ia.style.borderTopColor=c.headerBorder;}
  const ir=document.querySelector('.input-row');if(ir){ir.style.background=c.inputRowBg;ir.style.borderColor=c.inputRowBorder;}
  const ta=document.getElementById('msg-input');if(ta)ta.style.color=c.inputTextColor;
  document.querySelectorAll('.header-title,.brand-name').forEach(el=>el.style.color=c.textColor);
  document.querySelectorAll('.header-sub,.brand-sub,.s-label,.sb-label,.clear-btn').forEach(el=>el.style.color=c.textMuted);
  const sp=document.getElementById('settings-panel');if(sp){sp.style.background=c.settingsBg;sp.style.borderColor=c.settingsBorder;}
  document.querySelectorAll('.preset').forEach(el=>{el.style.background=c.presetBg;el.style.borderColor=c.presetBorder;el.style.color=c.presetColor;});
  document.querySelectorAll('.sb-btn').forEach(el=>{el.style.background=c.sbBtnBg;el.style.borderColor=c.sbBtnBorder;el.style.color=c.textMuted;});
  document.querySelectorAll('.brand').forEach(el=>el.style.borderColor=c.sidebarBorder);
  document.querySelectorAll('.blob').forEach((b,i)=>b.style.background=c.blobs[i]||c.blobs[0]);
  document.querySelectorAll('.bubble.bot').forEach(el=>{el.style.background=c.bubbleBotBg;el.style.borderColor=c.bubbleBotBorder;el.style.color=c.bubbleBotColor;});
  document.querySelectorAll('.bubble.user').forEach(el=>{el.style.background=c.primary;el.style.boxShadow=`0 4px 14px ${c.glow}`;el.style.color='#fff';});
  const snd=document.querySelector('.send-btn');if(snd){snd.style.background=c.primary;snd.style.boxShadow=`0 2px 10px ${c.glow}`;}
  document.querySelectorAll('.typing span').forEach(s=>s.style.background=c.accent);
  const hov=c.dark?'rgba(255,255,255,.09)':'rgba(0,0,0,.07)';
  let st=document.getElementById('dyn-t');if(!st){st=document.createElement('style');st.id='dyn-t';document.head.appendChild(st);}
  st.textContent=`.input-row textarea{color:${c.inputTextColor}!important;}.input-row textarea::placeholder{color:${c.ph}!important;}.lbtn{color:${c.textMuted}!important;border-color:${c.sidebarBorder}!important;}.lbtn.on,.lbtn:hover{color:#fff!important;background:${c.primary}!important;border-color:${c.primary}!important;}.preset:hover,.sb-btn:hover{background:${hov}!important;color:${c.textColor}!important;}.swatch.on{border-color:${c.textColor}!important;}.c-hamburger,.sidebar-close{color:${c.textMuted}!important;}`;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.t===t));
  localStorage.setItem('vg_theme',t);
}
function buildSwatches(){
  const w=document.getElementById('swatches');w.innerHTML='';
  Object.entries(THEMES).forEach(([k,v])=>{const d=document.createElement('div');d.className='swatch'+(k===theme?' on':'');d.style.background=k==='white'?'#e5e7eb':v.primary;if(k==='white')d.style.border='2px solid #d1d5db';d.dataset.t=k;d.title=k;d.onclick=()=>applyTheme(k);w.appendChild(d);});
}

(function init(){
  function setVh(){document.documentElement.style.setProperty('--vh',window.innerHeight*.01+'px');}
  setVh();window.addEventListener('resize',setVh);
  const saved=localStorage.getItem('vg_theme');
  applyTheme(saved&&THEMES[saved]?saved:'grey');
  buildSwatches();buildPresets();updateLabels();
  updateVoiceBtn();setState('ready');
  loadMsgs();renderMsgs();
  const ta=document.getElementById('msg-input');
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,110)+'px';});
})();
</script>
